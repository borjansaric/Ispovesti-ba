name: Isolated banner schedule checks
on:
  push:
    branches: [work/admin-panel-prep-20261028]
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/admin-read-gateway-isolated.test.mjs tests/chat-archive-core-isolated.test.mjs tests/metrics-core-isolated.test.mjs
