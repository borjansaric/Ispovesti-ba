name: Isolated recovery integration
on:
  push:
    branches: [work/recovery-local-ci-20261028]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start isolated local-only Supabase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-local"
          supabase init --workdir "$RUNNER_TEMP/recovery-local"
          mkdir -p "$RUNNER_TEMP/recovery-local/supabase/templates"
          printf '%s\n' '{{ .Token }}' > "$RUNNER_TEMP/recovery-local/supabase/templates/otp.html"
          printf '\n[auth.email.template.magic_link]\nsubject = "Local OTP"\ncontent_path = "./supabase/templates/otp.html"\n' >> "$RUNNER_TEMP/recovery-local/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/recovery-local"
      - name: Verify recovery against local Auth and local database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status --workdir "$RUNNER_TEMP/recovery-local" -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          node .github/scripts/recovery-integration.mjs
