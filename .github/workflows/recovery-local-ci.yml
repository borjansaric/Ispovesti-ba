name: Isolated recovery infrastructure check
on:
  push:
    branches: [work/recovery-local-ci-20261028]
permissions:
  contents: read
jobs:
  local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start a new local-only Supabase instance
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-local"
          supabase init --workdir "$RUNNER_TEMP/recovery-local"
          supabase start --workdir "$RUNNER_TEMP/recovery-local"
      - name: Check isolated Auth and email capture
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status --workdir "$RUNNER_TEMP/recovery-local" -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.API_URL;
          const service=process.env.SERVICE_ROLE_KEY;
          const anon=process.env.ANON_KEY;
          assert.match(base,/^http:\/\/(127\.0\.0\.1|localhost):/);
          assert.ok(service && anon);
          const email='admin-probe@example.test';
          const password='Example-Probe-Password-2026!';
          async function call(path,body,key) {
            const r=await fetch(base+path,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});
            assert.ok(r.ok, path+' returned '+r.status);
            return r.json();
          }
          const user=await call('/auth/v1/admin/users',{email,password,email_confirm:true},service);
          assert.ok(user.id);
          const session=await call('/auth/v1/token?grant_type=password',{email,password},anon);
          assert.equal(session.user.id,user.id);
          await call('/auth/v1/recover',{email},anon);
          const r=await fetch('http://127.0.0.1:54324/api/v1/messages');
          assert.ok(r.ok,'Mailpit unavailable');
          const messages=await r.json();
          assert.ok(messages.total>0,'No test email captured');
          console.log('Local Auth user, password login, recovery request and Mailpit capture: passed.');
          NODE
