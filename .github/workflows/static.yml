# Validate the production backend and the static allowlist before GitHub Pages' branch-based Jekyll deployment.
name: Verify production before Pages deployment

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "PRODUCTION_PREP.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run live overlap regression checks
        run: node --test tests/live-code-overlap.test.mjs
      - name: Verify production backend before publishing
        run: node scripts/check-live-ready.mjs
      - name: Build reviewed static allowlist
        run: node scripts/build-production-review.mjs
      - name: Verify allowlist output
        run: |
          test -f .production-review/index.html
          ! grep -R -E 'chat-test-api|admin-recovery-test-api|trialCode|TEST-|Deno\.env\.get|SUPABASE_SERVICE_ROLE_KEY' .production-review --exclude-dir=test
