name: Test branch validation (no deployment)

on:
  push:
    branches:
      - work/daily-highlights-20261117

permissions:
  contents: read

concurrency:
  group: test-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check test application JavaScript
        run: |
          node --check test/app.js
          node --check test/api.js
      - name: Run complete test suite
        run: npm test
