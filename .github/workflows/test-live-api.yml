name: Verify isolated live test API
on:
  push:
    branches: [work/live-test-20261024]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/test-live-api.mjs
