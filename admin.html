<!doctype html>
<html lang="sr-Latn-RS">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111111">
<title>Administracija · Ispovesti.ba</title>
<link rel="stylesheet" href="admin/admin.css">
<script src="config.js" defer></script>
<script src="vendor/supabase.js" defer></script>
<script type="module" src="admin/admin.mjs?v=20261124-module-singleton1"></script><script type="module" src="admin-recovery/forgot.mjs?v=20261124-module-singleton1"></script>
</head>
<body>
<main class="admin-shell">
<header class="admin-header">
  <div><p class="eyebrow">ISPOVESTI.BA · PRODUKCIJSKO OKRUŽENJE</p><h1>Administracija</h1><p class="intro">Jedinstveno mjesto za upravljanje sadržajem i zajednicom. Ovdje se postavke odnose na glavni sajt.</p></div>
  <button id="sign-out" class="secondary" type="button" hidden>Odjavi se</button>
</header>
<section id="login-panel" class="panel login-panel">
  <h2>Administratorska prijava</h2>
  <form id="login-form">
    <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Lozinka</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Prijavi se</button>
  </form>
  <form id="email-code-form" hidden>
    <label for="email-code">Sigurnosni kod sa e-maila</label><input id="email-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required>
    <button type="submit">Potvrdi kod</button>
  </form>
  <p id="login-status" class="status" role="status"></p>
</section>
<section id="admin-app" hidden>
  <div class="app-layout">
    <nav class="sidebar" aria-label="Administratorske cjeline" id="admin-nav">
      <button type="button" data-view="dashboard" class="active">Kontrolna tabla</button>
      <button type="button" data-view="confessions">Ispovijesti</button>
      <button type="button" data-view="comments">Komentari i odgovori</button>
      <button type="button" data-view="reports">Prijave</button>
      <button type="button" data-view="chat">Arhiva chata</button>
      <button type="button" data-view="stats">Statistika</button>
      <button type="button" data-view="analytics">Analitika posjetilaca</button>
      <button type="button" data-view="audit">Evidencija radnji</button>
      <button type="button" data-view="queue">Red objava</button>
    </nav>
    <section class="workspace">
      <div class="workspace-top"><p id="view-kicker" class="eyebrow">PREGLED STANJA</p><h2 id="view-title">Kontrolna tabla</h2><p id="view-description" class="muted"></p></div>
      <div id="view-content" aria-live="polite"></div>
      <p id="app-status" class="status" role="status"></p>
    </section>
  </div>
</section>
</main>
</body>
</html>
