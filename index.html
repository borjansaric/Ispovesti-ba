
<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ispovesti.ba — Neke priče zaslužuju drugu šansu</title>
  <meta name="description" content="Mjesto za anonimne ispovijesti, priče i komentare.">
  <style>
    :root {
      --bg: #111111;
      --panel: #1c1c1c;
      --gold: #d6b15e;
      --text: #eeeeee;
      --muted: #aaaaaa;
      --border: #353535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 14px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 32px 10px 22px;
    }

    header h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(30px, 7vw, 44px);
    }

    header p {
      color: var(--muted);
      margin: 8px auto 0;
      max-width: 540px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }

    h2 {
      color: var(--gold);
      font-size: 21px;
      margin: 0 0 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 130px;
      resize: vertical;
      background: #101010;
      color: var(--text);
      border: 1px solid #454545;
      border-radius: 8px;
      padding: 12px;
      font: inherit;
    }

    textarea:focus {
      outline: 1px solid var(--gold);
      border-color: var(--gold);
    }

    button {
      background: var(--gold);
      color: #17130a;
      border: 0;
      border-radius: 7px;
      padding: 11px 17px;
      margin-top: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 7px 0 0;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .story {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 17px;
      margin-bottom: 17px;
      overflow-wrap: anywhere;
    }

    .story-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .story-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }

    .comments {
      border-top: 1px solid var(--border);
      margin-top: 17px;
      padding-top: 13px;
    }

    .comment-title {
      color: var(--gold);
      font-size: 16px;
      margin: 0 0 10px;
    }

    .comment {
      border-left: 2px solid #555555;
      padding: 7px 10px;
      margin: 9px 0;
      background: #171717;
      border-radius: 0 6px 6px 0;
    }

    .comment-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .comment-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .comment-form textarea {
      min-height: 75px;
      margin-top: 12px;
    }

    .empty, .loading {
      color: var(--muted);
      text-align: center;
      padding: 18px 5px;
    }

    footer {
      max-width: 760px;
      margin: 28px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Ispovesti.ba</h1>
    <p>Neke priče nikad nisu zaboravljene. Neke nikad nisu ni ispričane.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Podijeli svoju ispovijest</h2>

      <form id="storyForm">
        <textarea
          id="storyInput"
          minlength="10"
          maxlength="5000"
          required
          placeholder="Napiši ono što želiš da podijeliš..."
        ></textarea>

        <p class="hint">Ispovijest može imati od 10 do 5000 znakova.</p>

        <button id="storyButton" type="submit">
          Objavi ispovijest
        </button>

        <div id="storyStatus" class="status" role="status"></div>
      </form>
    </section>

    <section>
      <h2>Najnovije ispovijesti</h2>
      <div id="stories">
        <p class="loading">Učitavam ispovijesti...</p>
      </div>
    </section>
  </main>

  <footer>
    Ispovesti.ba — neke stvari jednostavno zaslužuju drugu šansu.
  </footer>

  <script>
    const SUPABASE_URL =
      "https://roxajqagksffbsbzdrap.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_OZ1dhzKkN82uRpqjzbfbA_trakwga6";

    const API = SUPABASE_URL + "/rest/v1";

    async function apiRequest(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Greška servera: " + response.status);
      }

      if (response.status === 204) {
        return null;
      }

      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("sr-Latn", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function makeElement(tag, className, content) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    }

    async function loadComments(confessionId, container, countLabel) {
      container.replaceChildren(
        makeElement("p", "hint", "Učitavam komentare...")
      );

      try {
        const comments = await apiRequest(
          "/comments?select=id,content,created_at" +
          "&confession_id=eq." + encodeURIComponent(confessionId) +
          "&order=created_at.asc&limit=100"
        );

        countLabel.textContent = "Komentari (" + comments.length + ")";
        container.replaceChildren();

        if (comments.length === 0) {
          container.append(
            makeElement("p", "hint", "Još nema komentara.")
          );
          return;
        }

        comments.forEach(item => {
          const comment = makeElement("div", "comment");
          const content = makeElement(
            "div",
            "comment-content",
            item.content
          );

          comment.append(content);

          if (item.created_at) {
            comment.append(
              makeElement(
                "div",
                "comment-date",
                formatDate(item.created_at)
              )
            );
          }

          container.append(comment);
        });
      } catch (error) {
        container.replaceChildren(
          makeElement(
            "p",
            "hint",
            "Komentari se trenutno ne mogu učitati. " +
            "Provjeri podešavanja tabele comments u Supabaseu."
          )
        );

        console.error("Greška pri učitavanju komentara:", error);
      }
    }

    function createStory(item) {
      const story = makeElement("article", "story");

      const content = makeElement(
        "div",
        "story-content",
        item.content
      );

      story.append(content);

      if (item.created_at) {
        story.append(
          makeElement(
            "div",
            "story-date",
            formatDate(item.created_at)
          )
        );
      }

      const commentsSection = makeElement("section", "comments");
      const commentTitle = makeElement(
        "h3",
        "comment-title",
        "Komentari..."
      );

      const commentsList = makeElement("div", "comment-list");

      const commentForm = makeElement("form", "comment-form");
      const commentInput = document.createElement("textarea");

      commentInput.required = true;
      commentInput.minLength = 1;
      commentInput.maxLength = 3000;
      commentInput.placeholder = "Napiši komentar...";

      const commentButton = makeElement(
        "button",
        "",
        "Objavi komentar"
      );
      commentButton.type = "submit";

      const commentStatus = makeElement("div", "status");

      commentForm.append(
        commentInput,
        commentButton,
        commentStatus
      );

      commentForm.addEventListener("submit", async event => {
        event.preventDefault();

        const commentContent = commentInput.value.trim();

        if (commentContent.length < 1) {
          commentStatus.textContent = "Napiši komentar.";
          return;
        }

        commentButton.disabled = true;
        commentStatus.textContent = "Objavljujem komentar...";

        try {
          await apiRequest("/comments", {
            method: "POST",
            headers: {
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              confession_id: item.id,
              content: commentContent
            })
          });

          commentInput.value = "";
          commentStatus.textContent = "Komentar je objavljen.";

          await loadComments(
            item.id,
            commentsList,
            commentTitle
          );
        } catch (error) {
          console.error("Greška pri objavljivanju komentara:", error);
          commentStatus.textContent =
            "Komentar nije objavljen. Provjeri vezu i podešavanja. " +
            "Detalji: " + error.message;
        } finally {
          commentButton.disabled = false;
        }
      });

      commentsSection.append(
        commentTitle,
        commentsList,
        commentForm
      );

      story.append(commentsSection);

      loadComments(item.id, commentsList, commentTitle);

      return story;
    }

    async function loadStories() {
      const storiesContainer = document.getElementById("stories");

      storiesContainer.replaceChildren(
        makeElement("p", "loading", "Učitavam ispovijesti...")
      );

      try {
        const stories = await apiRequest(
          "/confessions?select=id,content,created_at" +
          "&order=created_at.desc&limit=50"
        );

        storiesContainer.replaceChildren();

        if (!stories.length) {
          storiesContainer.append(
            makeElement(
              "p",
              "empty",
              "Još nema ispovijesti. Budi prvi koji će je podijeliti."
            )
          );
          return;
        }

        stories.forEach(item => {
          storiesContainer.append(createStory(item));
        });
      } catch (error) {
        console.error("Greška pri učitavanju ispovijesti:", error);

        storiesContainer.replaceChildren(
          makeElement(
            "p",
            "empty",
            "Ispovijesti se trenutno ne mogu učitati. " +
            "Provjeri internet i Supabase podešavanja."
          )
        );
      }
    }

    document.getElementById("storyForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const input = document.getElementById("storyInput");
        const button = document.getElementById("storyButton");
        const status = document.getElementById("storyStatus");
        const content = input.value.trim();

        if (content.length < 10 || content.length > 5000) {
          status.textContent =
            "Ispovijest mora imati između 10 i 5000 znakova.";
          return;
        }

        button.disabled = true;
        status.textContent = "Objavljujem ispovijest...";

        try {
          await apiRequest("/confessions", {
            method: "POST",
            headers: {
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              content: content
            })
          });

          input.value = "";
          status.textContent = "Ispovijest je objavljena.";

          await loadStories();
        } catch (error) {
          console.error("Greška pri objavljivanju ispovijesti:", error);

          status.textContent =
            "Ispovijest nije objavljena. Provjeri vezu i podešavanja. " +
            "Detalji: " + error.message;
        } finally {
          button.disabled = false;
        }
      }
    );

    loadStories();
  </script>
</body>
</html>
