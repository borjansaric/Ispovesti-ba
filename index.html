<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ispovesti.ba — Neke priče zaslužuju drugu šansu</title>
  <meta name="description" content="Mjesto za anonimne ispovijesti, priče i komentare.">
  <style>
    :root{--bg:#111;--panel:#1c1c1c;--gold:#d6b15e;--text:#eee;--muted:#aaa;--border:#353535}
    *{box-sizing:border-box}
    body{margin:0;padding:0 14px 40px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.6}
    header{text-align:center;padding:32px 10px 22px}
    header h1{margin:0;color:var(--gold);font-size:clamp(30px,7vw,44px)}
    header p{color:var(--muted);margin:8px auto 0;max-width:540px}
    main{width:100%;max-width:760px;margin:0 auto}
    .panel,.story{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:22px;overflow-wrap:anywhere}
    h2{color:var(--gold);font-size:21px;margin:0 0 12px}
    textarea{display:block;width:100%;min-height:130px;resize:vertical;background:#101010;color:var(--text);border:1px solid #454545;border-radius:8px;padding:12px;font:inherit}
    textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
    button{background:var(--gold);color:#17130a;border:0;border-radius:7px;padding:10px 14px;margin-top:10px;font-weight:bold;font-size:14px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .reply-button{background:transparent;color:var(--gold);border:1px solid #625332;padding:5px 10px;font-size:12px;margin-top:7px}
    .hint{color:var(--muted);font-size:13px;margin:7px 0 0}
    .status{margin-top:10px;font-size:14px;overflow-wrap:anywhere}
    .story-content,.comment-content{white-space:pre-wrap;overflow-wrap:anywhere}
    .story-date,.comment-date{color:var(--muted);font-size:11px;margin-top:4px}
    .story-date{font-size:12px;margin-top:12px}
    .vote-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .vote-button{background:#222;color:var(--text);border:1px solid #625332;margin:0;padding:7px 12px}
    .vote-button.selected{background:#3b321e;border-color:var(--gold);color:var(--gold)}
    .vote-status{color:var(--muted);font-size:12px;margin-top:5px;min-height:18px}
    .comments{border-top:1px solid var(--border);margin-top:17px;padding-top:13px}
    .comment-title{color:var(--gold);font-size:16px;margin:0 0 10px}
    .comment{border-left:2px solid #555;padding:7px 10px;margin:9px 0;background:#171717;border-radius:0 6px 6px 0;min-width:0}
    .comment-replies{margin-left:12px;padding-left:8px;border-left:1px solid #393939}
    .comment-form textarea{min-height:75px;margin-top:12px}
    .reply-form textarea{min-height:65px;margin-top:8px}
    .empty,.loading{color:var(--muted);text-align:center;padding:18px 5px}
    footer{max-width:760px;margin:28px auto 0;color:var(--muted);text-align:center;font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>Ispovesti.ba</h1>
    <p>Neke priče nikad nisu zaboravljene. Neke nikad nisu ni ispričane.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Podijeli svoju ispovijest</h2>
      <form id="storyForm">
        <textarea id="storyInput" minlength="10" maxlength="5000" required placeholder="Napiši ono što želiš da podijeliš..."></textarea>
        <p class="hint">Ispovijest može imati od 10 do 5000 znakova.</p>
        <button id="storyButton" type="submit">Objavi ispovijest</button>
        <div id="storyStatus" class="status" role="status"></div>
      </form>
    </section>
    <section>
      <h2>Najnovije ispovijesti</h2>
      <div id="stories"><p class="loading">Učitavam ispovijesti...</p></div>
    </section>
  </main>
  <footer>Ispovesti.ba — neke stvari jednostavno zaslužuju drugu šansu.</footer>
  <script>
    const SUPABASE_URL = "https://roxajqagksffbsbzdrap.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OZ1dhjzKkN82uRpqjzbfbA_trakwga6";
    const API = SUPABASE_URL + "/rest/v1";
    const SUBMIT_URL = SUPABASE_URL + "/functions/v1/submit-content";
    const VOTE_URL = SUPABASE_URL + "/functions/v1/vote-content9";

    function getVoterKey(){
      let key = localStorage.getItem("ispovesti_vote_key");
      if (!key) {
        key = (crypto.randomUUID ? crypto.randomUUID() : "voter-" + Date.now() + "-" + Math.random().toString(36).slice(2)) + "-ispovesti";
        localStorage.setItem("ispovesti_vote_key", key);
      }
      return key;
    }
    const VOTER_KEY = getVoterKey();

    async function apiRequest(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...options.headers}
      });
      if (!response.ok) throw new Error((await response.text()) || "Greška servera: " + response.status);
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function submitContent(data) {
      const response = await fetch(SUBMIT_URL, {
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
        body:JSON.stringify(data)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw new Error(result.error || "Greška servera: " + response.status);
      return result;
    }

    async function requestVote(confessionId, action, voteType) {
      const response = await fetch(VOTE_URL, {
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
        body:JSON.stringify({confession_id:Number(confessionId),voter_key:VOTER_KEY,action,vote_type:voteType})
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw new Error(result.error || "Glasanje nije uspjelo: " + response.status);
      return result;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("sr-Latn",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    }
    function makeElement(tag, className, content) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (content !== undefined) element.textContent = content;
      return element;
    }

    async function loadComments(confessionId, container, countLabel) {
      container.replaceChildren(makeElement("p","hint","Učitavam komentare..."));
      try {
        const comments = await apiRequest("/comments?select=id,content,created_at,parent_id&confession_id=eq."+encodeURIComponent(confessionId)+"&order=created_at.asc&limit=1000");
        countLabel.textContent = "Komentari (" + comments.length + ")";
        container.replaceChildren();
        if (!comments.length) { container.append(makeElement("p","hint","Još nema komentara.")); return; }
        const children = new Map();
        const knownIds = new Set(comments.map(item => String(item.id)));
        comments.forEach(item => {
          const parentId = item.parent_id == null ? null : String(item.parent_id);
          const validParent = parentId !== null && knownIds.has(parentId) && parentId !== String(item.id);
          const key = validParent ? parentId : "root";
          if (!children.has(key)) children.set(key,[]);
          children.get(key).push(item);
        });
        function renderComment(item, ancestors) {
          const comment = makeElement("div","comment");
          comment.append(makeElement("div","comment-content",item.content));
          if (item.created_at) comment.append(makeElement("div","comment-date",formatDate(item.created_at)));
          const replyButton = makeElement("button","reply-button","Odgovori");
          replyButton.type = "button";
          const replyForm = makeElement("form","reply-form");
          replyForm.hidden = true;
          const replyInput = document.createElement("textarea");
          replyInput.required = true; replyInput.minLength = 1; replyInput.maxLength = 3000; replyInput.placeholder = "Napiši odgovor...";
          const sendButton = makeElement("button","","Objavi odgovor"); sendButton.type = "submit";
          const cancelButton = makeElement("button","reply-button","Odustani"); cancelButton.type = "button";
          const status = makeElement("div","status");
          replyForm.append(replyInput,sendButton,cancelButton,status);
          replyButton.addEventListener("click",() => { replyForm.hidden = !replyForm.hidden; if (!replyForm.hidden) replyInput.focus(); });
          cancelButton.addEventListener("click",() => { replyForm.hidden = true; replyInput.value = ""; status.textContent = ""; });
          replyForm.addEventListener("submit",async event => {
            event.preventDefault(); const content = replyInput.value.trim();
            if (!content) { status.textContent = "Napiši odgovor."; return; }
            sendButton.disabled = true; replyButton.disabled = true; status.textContent = "Objavljujem odgovor...";
            try {
              await submitContent({type:"reply",confession_id:Number(confessionId),parent_id:Number(item.id),content});
              await loadComments(confessionId,container,countLabel);
            } catch(error) {
              console.error("Greška pri objavljivanju odgovora:",error); status.textContent = error.message || "Odgovor nije objavljen.";
              sendButton.disabled = false; replyButton.disabled = false;
            }
          });
          comment.append(replyButton,replyForm);
          const replies = makeElement("div","comment-replies");
          const nextAncestors = new Set(ancestors); nextAncestors.add(String(item.id));
          (children.get(String(item.id)) || []).forEach(reply => { if (!nextAncestors.has(String(reply.id))) replies.append(renderComment(reply,nextAncestors)); });
          if (replies.childElementCount) comment.append(replies);
          return comment;
        }
        (children.get("root") || []).forEach(item => container.append(renderComment(item,new Set())));
      } catch(error) {
        console.error("Greška pri učitavanju komentara:",error);
        container.replaceChildren(makeElement("p","hint","Komentari se trenutno ne mogu učitati. Detalji: " + error.message));
      }
    }

    function createVoteControls(item) {
      const row = makeElement("div","vote-row");
      const likeButton = makeElement("button","vote-button","👍 0"); likeButton.type = "button";
      const dislikeButton = makeElement("button","vote-button","👎 0"); dislikeButton.type = "button";
      const status = makeElement("div","vote-status","");
      let busy = false;
      function show(result) {
        likeButton.textContent = "👍 " + result.likes;
        dislikeButton.textContent = "👎 " + result.dislikes;
        likeButton.classList.toggle("selected",result.my_vote === "like");
        dislikeButton.classList.toggle("selected",result.my_vote === "dislike");
        status.textContent = "";
      }
      async function vote(type) {
        if (busy) return;
        busy = true; likeButton.disabled = true; dislikeButton.disabled = true; status.textContent = "Sačuvam glas...";
        try { show(await requestVote(item.id,"vote",type)); }
        catch(error) { console.error("Greška pri glasanju:",error); status.textContent = error.message || "Glas nije sačuvan."; }
        finally { busy = false; likeButton.disabled = false; dislikeButton.disabled = false; }
      }
      likeButton.addEventListener("click",() => vote("like"));
      dislikeButton.addEventListener("click",() => vote("dislike"));
      row.append(likeButton,dislikeButton);
      const wrapper = makeElement("div",""); wrapper.append(row,status);
      requestVote(item.id,"count").then(show).catch(error => { console.error("Greška pri učitavanju glasova:",error); status.textContent = "Glasovi se trenutno ne mogu učitati."; });
      return wrapper;
    }

    function createStory(item) {
      const story = makeElement("article","story");
      story.append(makeElement("div","story-content",item.content));
      if (item.created_at) story.append(makeElement("div","story-date",formatDate(item.created_at)));
      story.append(createVoteControls(item));
      const commentsSection = makeElement("section","comments");
      const commentTitle = makeElement("h3","comment-title","Komentari...");
      const commentsList = makeElement("div","comment-list");
      const commentForm = makeElement("form","comment-form");
      const commentInput = document.createElement("textarea");
      commentInput.required = true; commentInput.minLength = 1; commentInput.maxLength = 3000; commentInput.placeholder = "Napiši komentar...";
      const commentButton = makeElement("button","","Objavi komentar"); commentButton.type = "submit";
      const commentStatus = makeElement("div","status");
      commentForm.append(commentInput,commentButton,commentStatus);
      commentForm.addEventListener("submit",async event => {
        event.preventDefault(); const content = commentInput.value.trim();
        if (!content) { commentStatus.textContent = "Napiši komentar."; return; }
        commentButton.disabled = true; commentStatus.textContent = "Objavljujem komentar...";
        try {
          await submitContent({type:"comment",confession_id:Number(item.id),content});
          commentInput.value = ""; commentStatus.textContent = "Komentar je objavljen.";
          await loadComments(item.id,commentsList,commentTitle);
        } catch(error) { console.error("Greška pri objavljivanju komentara:",error); commentStatus.textContent = error.message || "Komentar nije objavljen."; }
        finally { commentButton.disabled = false; }
      });
      commentsSection.append(commentTitle,commentsList,commentForm); story.append(commentsSection);
      loadComments(item.id,commentsList,commentTitle);
      return story;
    }

    async function loadStories() {
      const container = document.getElementById("stories");
      container.replaceChildren(makeElement("p","loading","Učitavam ispovijesti..."));
      try {
        const stories = await apiRequest("/confessions?select=id,content,created_at&order=created_at.desc&limit=50");
        container.replaceChildren();
        if (!stories.length) { container.append(makeElement("p","empty","Još nema ispovijesti. Budi prvi koji će je podijeliti.")); return; }
        stories.forEach(item => container.append(createStory(item)));
      } catch(error) {
        console.error("Greška pri učitavanju ispovijesti:",error);
        container.replaceChildren(makeElement("p","empty","Ispovijesti se trenutno ne mogu učitati. Provjeri internet i Supabase podešavanja. Detalji: " + error.message));
      }
    }

    document.getElementById("storyForm").addEventListener("submit",async event => {
      event.preventDefault();
      const input = document.getElementById("storyInput"), button = document.getElementById("storyButton"), status = document.getElementById("storyStatus");
      const content = input.value.trim();
      if (content.length < 10 || content.length > 5000) { status.textContent = "Ispovijest mora imati između 10 i 5000 znakova."; return; }
      button.disabled = true; status.textContent = "Objavljujem ispovijest...";
      try { await submitContent({type:"confession",content}); input.value = ""; status.textContent = "Ispovijest je objavljena."; await loadStories(); }
      catch(error) { console.error("Greška pri objavljivanju ispovijesti:",error); status.textContent = error.message || "Ispovijest nije objavljena."; }
      finally { button.disabled = false; }
    });
    loadStories();
  </script>
</body>
</html>
